apiVersion: 1

datasources:
  - name: LenderPlatform
    type: postgres
    uid: lender_platform_pg
    # Grafana supports $__env{VAR} for environment variable substitution in provisioning
    url: $__env{GRAFANA_PG_HOST}:5432
    database: postgres
    user: $__env{GRAFANA_PG_USER}
    secureJsonData:
      password: $__env{GRAFANA_PG_PASSWORD}
    jsonData:
      sslmode: require
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: false
