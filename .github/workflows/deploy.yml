name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Test FastAPI ─────────────────────────────────────────────
  test-api:
    name: Validate API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/api/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/api/requirements.txt

      - name: Import check
        run: |
          cd backend/api
          DATABASE_URL=postgresql://x:x@localhost/x \
          CORS_ORIGINS=http://localhost:3000 \
          python -c "from main import app; print('API import OK')"

      - name: Pydantic model validation
        run: |
          cd backend/api
          python -c "
          from models.loan import BorrowerProfile
          # Valid input
          p = BorrowerProfile(loan_type='MSME Loan', loan_amount=25, credit_score=700, employment_type='business', state='Maharashtra')
          assert p.employment_type == 'business'
          # Invalid loan_type must raise
          try:
              BorrowerProfile(loan_type='BadType', loan_amount=25, credit_score=700, employment_type='business', state='Maharashtra')
              raise AssertionError('Should have raised ValueError')
          except ValueError:
              pass
          print('Model validation OK')
          "

  # ── Lint frontend ────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

  # ── Check migration syntax ───────────────────────────────────
  check-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check backward-compat rules
        run: |
          python -c "
          import re, sys
          from pathlib import Path

          forbidden = [
              # DROP COLUMN is always destructive — no exceptions
              (r'\bDROP\s+COLUMN\b', 'DROP COLUMN forbidden (data loss risk)'),
              # Bare DROP TABLE without IF EXISTS is dangerous in prod
              # DROP TABLE IF EXISTS is allowed (safe for replacing old structures)
              (r'\bDROP\s+TABLE\s+(?!IF\s+EXISTS\b)', 'DROP TABLE without IF EXISTS forbidden'),
              # NOT NULL column added via ALTER TABLE without a DEFAULT
              # risks locking the table on large datasets
              (r'ALTER\s+TABLE\b[^;]*\bNOT\s+NULL\b(?![^;]*\bDEFAULT\b)', 'NOT NULL without DEFAULT'),
          ]

          errors = []
          for f in sorted(Path('database/migrations').glob('*.sql')):
              sql = f.read_text(encoding='utf-8')
              for pat, msg in forbidden:
                  if re.search(pat, sql, re.IGNORECASE):
                      errors.append(f'{f.name}: {msg}')

          if errors:
              print('Migration violations:')
              for e in errors: print(' ', e)
              sys.exit(1)
          print('All migrations OK')
          "

  # ── Deploy API (Render) — only on push to main ───────────────
  deploy-api:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    needs: [test-api, lint-frontend, check-migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # ── Run migrations after API deploy ─────────────────────────
  run-migrations:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install psycopg2-binary python-dotenv

      - name: Run migrations
        run: python database/migrate.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
