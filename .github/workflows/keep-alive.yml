name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # Use secret if set, otherwise fall back to known production URL
          URL="${BACKEND_URL:-https://lender-platform.onrender.com}"
          echo "Pinging $URL/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/health" || echo "000")
          echo "Backend responded: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "Warning: backend unreachable (timeout or connection error)"
          elif [ "$STATUS" != "200" ]; then
            echo "Warning: backend returned $STATUS"
          else
            echo "OK — backend is awake"
          fi
