version: "3.9"

# ══════════════════════════════════════════════════════════════
# Lender Platform — Full Stack (with Airflow orchestration)
#
# For a simpler setup without Airflow, use: docker-compose.mvp.yml
#
# Services:
#   api           — FastAPI  (port 8000)
#   airflow-*     — Apache Airflow (orchestration + parallel extraction)
#   redis         — Airflow Celery broker
#   airflow-db    — Airflow metadata DB (NOT the main Supabase DB)
#   grafana       — Analytics dashboards (port 3001)
#
# Main database: Supabase (external).
# Set DATABASE_URL and other secrets in .env (never commit .env)
# ══════════════════════════════════════════════════════════════

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR:                  CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:      postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db/airflow
    AIRFLOW__CELERY__BROKER_URL:              redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND:          db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES:             "false"
    AIRFLOW__API__AUTH_BACKENDS:              airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__SECRET_KEY:           ${AIRFLOW_SECRET_KEY:-change-this-in-production}
    # Secrets passed through to DAG tasks
    DATABASE_URL:                             ${DATABASE_URL}
    SUPABASE_URL:                             ${SUPABASE_URL}
    SUPABASE_SERVICE_ROLE_KEY:                ${SUPABASE_SERVICE_ROLE_KEY}
    GEMINI_API_KEY:                           ${GEMINI_API_KEY}
    PROJECT_ROOT:                             /opt/lender-platform
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./backend:/opt/lender-platform/backend
    - ./database:/opt/lender-platform/database
    - ./data:/opt/lender-platform/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:

  # ── FastAPI ──────────────────────────────────────────────────
  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:        ${DATABASE_URL}
      CORS_ORIGINS:        ${CORS_ORIGINS:-http://localhost:3000}
      SENTRY_DSN:          ${SENTRY_DSN:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      REDIS_URL:           redis://redis:6379/1
      DB_POOL_MIN:         ${DB_POOL_MIN:-2}
      DB_POOL_MAX:         ${DB_POOL_MAX:-10}
      ENV:                 ${ENV:-production}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Airflow metadata DB ──────────────────────────────────────
  airflow-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB:       airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (Celery broker) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Airflow init (runs once, then exits) ─────────────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db migrate &&
        (airflow users create
          --username admin
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@lenderplatform.local || true)
      "
    restart: "no"

  # ── Airflow webserver ────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow scheduler ────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Celery worker ────────────────────────────────────
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    environment:
      <<: *airflow-env
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_INSTALL_PLUGINS:         grafana-piechart-panel
      # These are read by provisioning YAML via $__env{} syntax
      GRAFANA_PG_HOST:     ${GRAFANA_PG_HOST}
      GRAFANA_PG_USER:     ${GRAFANA_PG_USER}
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  airflow_db_data:
  airflow_logs:
  grafana_data:
